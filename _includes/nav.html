<header class="site-header" id="top">
  <div class="shell site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Bilwasiva Basu Mallick homepage">
      <span class="brand-mark" aria-hidden="true">B<span>.</span></span>
      <span class="brand-type"><strong>Bilwasiva</strong><small>Basu Mallick</small></span>
    </a>
    <nav class="nav-links" id="primary-navigation" aria-label="Primary navigation">
      <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a {% if page.url contains '/writing/' or page.layout == 'post' %}aria-current="page"{% endif %} href="{{ '/writing/' | relative_url }}">Writing</a>
      <a {% if page.url contains '/projects/' %}aria-current="page"{% endif %} href="{{ '/projects/' | relative_url }}">Work</a>
      <a {% if page.url contains '/start-here/' %}aria-current="page"{% endif %} href="{{ '/start-here/' | relative_url }}">Start here</a>
      <a {% if page.url contains '/aboutme/' %}aria-current="page"{% endif %} href="{{ '/aboutme/' | relative_url }}">About</a>
      <a href="https://drive.google.com/file/d/1gPxknuBRddlNLy1l4IB9EwX9YlxjICuM/view?usp=sharing" target="_blank" rel="noopener noreferrer">Résumé <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="icon-action theme-action" aria-label="Toggle appearance" title="Toggle light and dark mode"><span aria-hidden="true">◐</span></button>
      <a class="header-cta" href="{{ '/contact/' | relative_url }}">Let's connect <span aria-hidden="true">↗</span></a>
      <button type="button" id="menu-toggle" class="icon-action menu-action" aria-controls="primary-navigation" aria-expanded="false" aria-label="Open menu"><span class="hamburger" aria-hidden="true"></span></button>
    </div>
  </div>
</header>
