---
<!doctype html>
<html lang="en">
  {% include head.html %}
  <body class="site-body {% if page.layout == 'post' %}is-post{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include nav.html %}
    {{ content }}
    {% include footer.html %}
    <script defer src="{{ '/js/site.js' | relative_url }}"></script>
    {% if page.ext-js %}{% for js in page.ext-js %}{% if js.href %}<script defer src="{{ js.href }}"></script>{% else %}<script defer src="{{ js }}"></script>{% endif %}{% endfor %}{% elsif page.use_math %}<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>{% endif %}
  </body>
</html>
