<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" viewBox="0 0 1500 900" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#081425" height="900" rx="28" width="1500" x="0" y="0" /><rect fill="none" height="852" rx="24" stroke="#34506d" stroke-width="2" width="1452" x="24" y="24" /><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="bold" x="62" y="78">A deployable physical-AI architecture</text><text fill="#afc4dd" font-family="Arial,Helvetica,sans-serif" font-size="21" x="62" y="119">Separate learned perception and planning from independent, enforceable safety controls</text><rect fill="#122943" height="168" rx="18" stroke="#75afff" stroke-width="2" width="290" x="75" y="180" /><rect fill="#75afff" height="8" rx="4" width="290" x="75" y="180" /><text fill="#75afff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="99" y="227">1 · SENSE</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="99" y="270">Cameras · depth · force</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="99" y="301">Proprioception · telemetry</text><rect fill="#122943" height="168" rx="18" stroke="#31dce5" stroke-width="2" width="300" x="464" y="180" /><rect fill="#31dce5" height="8" rx="4" width="300" x="464" y="180" /><text fill="#31dce5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="488" y="227">2 · ESTIMATE</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="488" y="270">Fuse observations</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="488" y="301">Belief / latent state</text><rect fill="#122943" height="168" rx="18" stroke="#f7bd61" stroke-width="2" width="300" x="862" y="180" /><rect fill="#f7bd61" height="8" rx="4" width="300" x="862" y="180" /><text fill="#f7bd61" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="886" y="227">3 · PREDICT</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="886" y="270">Action-conditioned dynamics</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="886" y="301">Uncertainty / rollouts</text><rect fill="#122943" height="168" rx="18" stroke="#31dce5" stroke-width="2" width="300" x="1110" y="451" /><rect fill="#31dce5" height="8" rx="4" width="300" x="1110" y="451" /><text fill="#31dce5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="1134" y="498">4 · PLAN</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1134" y="541">VLA proposals + MPC</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1134" y="572">Goal + cost + constraints</text><rect fill="#122943" height="168" rx="18" stroke="#73e4bb" stroke-width="2" width="310" x="724" y="451" /><rect fill="#73e4bb" height="8" rx="4" width="310" x="724" y="451" /><text fill="#73e4bb" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="748" y="498">5 · SAFETY</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="748" y="541">Workspace + collision checks</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="748" y="572">Independent safety shield</text><rect fill="#122943" height="168" rx="18" stroke="#75afff" stroke-width="2" width="318" x="317" y="451" /><rect fill="#75afff" height="8" rx="4" width="318" x="317" y="451" /><text fill="#75afff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="341" y="498">6 · CONTROL</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="341" y="541">Robot-specific controller</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="341" y="572">Bounded low-level actions</text><rect fill="#122943" height="100" rx="18" stroke="#73e4bb" stroke-width="2" width="1340" x="75" y="704" /><rect fill="#73e4bb" height="8" rx="4" width="1340" x="75" y="704" /><text fill="#73e4bb" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="99" y="751">OBSERVE AGAIN  →  Compare intended and measured state  →  Replan or stop safely</text><line stroke="#31dce5" stroke-width="4" x1="365" x2="463" y1="264" y2="264" /><polygon fill="#31dce5" points="463,264 449.8362615716444,271.19138307906303 449.8362615716444,256.80861692093697" /><line stroke="#31dce5" stroke-width="4" x1="765" x2="861" y1="264" y2="264" /><polygon fill="#31dce5" points="861,264 847.8362615716444,271.19138307906303 847.8362615716444,256.80861692093697" /><line stroke="#31dce5" stroke-width="4" x1="1162" x2="1249" y1="349" y2="450" /><polygon fill="#31dce5" points="1249,450 1234.9601164325886,444.71969040552233 1245.8574458489632,435.3328818983482" /><line stroke="#31dce5" stroke-width="4" x1="1109" x2="1035" y1="535" y2="535" /><polygon fill="#31dce5" points="1035,535 1048.1637384283556,527.808616920937 1048.1637384283556,542.191383079063" /><line stroke="#31dce5" stroke-width="4" x1="724" x2="636" y1="535" y2="535" /><polygon fill="#31dce5" points="636,535 649.1637384283556,527.808616920937 649.1637384283556,542.191383079063" /><line stroke="#31dce5" stroke-width="4" x1="477" x2="477" y1="619" y2="704" /><polygon fill="#31dce5" points="477,704 469.80861692093697,690.8362615716444 484.19138307906303,690.8362615716444" /><line stroke="#73e4bb" stroke-width="4" x1="175" x2="175" y1="704" y2="348" /><polygon fill="#73e4bb" points="175,348 182.19138307906303,361.1637384283556 167.80861692093694,361.1637384283556" /><text fill="#f7bd61" font-family="Arial" font-size="20" x="64" y="855">Independent emergency stop, limits and interlocks sit BELOW model authority</text></svg>