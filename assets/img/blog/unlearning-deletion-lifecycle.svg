<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="ttl desc"><title id="ttl">From erasure request to verified system-wide deletion</title><desc id="desc">A six-stage lifecycle linking request scope, data lineage, artifact quarantine, model update, redeployment, and verification with feedback and audit records.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1934"/><stop offset="1" stop-color="#101c31"/></linearGradient><linearGradient id="tile" x2="1" y2="1"><stop stop-color="#1c3153"/><stop offset="1" stop-color="#162640"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#5eead4" stroke-width="2"/></marker></defs><rect width="1600" height="940" fill="url(#bg)"/><text x="80" y="103" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="47" fill="#f7fbff">An erasure request is a workflow, not a DELETE statement.</text><text x="80" y="149" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#bacbe4">Track every derivative artifact, update models, verify outcomes, and record what remains subject to retention rules.</text><rect x="76" y="248" width="464" height="247" rx="27" fill="url(#tile)" stroke="#334e74" stroke-width="2"/><circle cx="131" cy="305" r="31" fill="#0b243e" stroke="#5eead4" stroke-width="3"/><text x="131" y="315" text-anchor="middle" font-size="27" font-family="Arial" font-weight="bold" fill="#5eead4">01</text><text x="111" y="378" font-family="Arial" font-size="31" font-weight="700" fill="#f7fbff">Resolve &amp; authorize</text><text x="111" y="430" font-family="Arial" font-size="23" fill="#c2d0e7">Identity, scope, legal basis</text><text x="111" y="464" font-family="Arial" font-size="23" fill="#c2d0e7">Define records + downstream IDs</text><path d="M541 371 H571" fill="none" stroke="#5eead4" stroke-width="5" marker-end="url(#ar)"/><rect x="581" y="248" width="464" height="247" rx="27" fill="url(#tile)" stroke="#334e74" stroke-width="2"/><circle cx="636" cy="305" r="31" fill="#0b243e" stroke="#7dd3fc" stroke-width="3"/><text x="636" y="315" text-anchor="middle" font-size="27" font-family="Arial" font-weight="bold" fill="#7dd3fc">02</text><text x="616" y="378" font-family="Arial" font-size="31" font-weight="700" fill="#f7fbff">Trace lineage</text><text x="616" y="430" font-family="Arial" font-size="23" fill="#c2d0e7">Sources, replicas, ETL, features</text><text x="616" y="464" font-family="Arial" font-size="23" fill="#c2d0e7">Indexes, training runs, exports</text><path d="M1046 371 H1076" fill="none" stroke="#5eead4" stroke-width="5" marker-end="url(#ar)"/><rect x="1086" y="248" width="464" height="247" rx="27" fill="url(#tile)" stroke="#334e74" stroke-width="2"/><circle cx="1141" cy="305" r="31" fill="#0b243e" stroke="#fbbf24" stroke-width="3"/><text x="1141" y="315" text-anchor="middle" font-size="27" font-family="Arial" font-weight="bold" fill="#fbbf24">03</text><text x="1121" y="378" font-family="Arial" font-size="31" font-weight="700" fill="#f7fbff">Contain &amp; delete</text><text x="1121" y="430" font-family="Arial" font-size="23" fill="#c2d0e7">Block re-ingestion; retire access</text><text x="1121" y="464" font-family="Arial" font-size="23" fill="#c2d0e7">Clear retrieval and serving caches</text><rect x="76" y="573" width="464" height="247" rx="27" fill="url(#tile)" stroke="#334e74" stroke-width="2"/><circle cx="131" cy="630" r="31" fill="#0b243e" stroke="#e9a8ff" stroke-width="3"/><text x="131" y="640" text-anchor="middle" font-size="27" font-family="Arial" font-weight="bold" fill="#e9a8ff">04</text><text x="111" y="703" font-family="Arial" font-size="31" font-weight="700" fill="#f7fbff">Update model</text><text x="111" y="755" font-family="Arial" font-size="23" fill="#c2d0e7">Retrain, exact removal, or</text><text x="111" y="789" font-family="Arial" font-size="23" fill="#c2d0e7">a justified approximate method</text><path d="M541 696 H571" fill="none" stroke="#5eead4" stroke-width="5" marker-end="url(#ar)"/><rect x="581" y="573" width="464" height="247" rx="27" fill="url(#tile)" stroke="#334e74" stroke-width="2"/><circle cx="636" cy="630" r="31" fill="#0b243e" stroke="#7dd3fc" stroke-width="3"/><text x="636" y="640" text-anchor="middle" font-size="27" font-family="Arial" font-weight="bold" fill="#7dd3fc">05</text><text x="616" y="703" font-family="Arial" font-size="31" font-weight="700" fill="#f7fbff">Deploy atomically</text><text x="616" y="755" font-family="Arial" font-size="23" fill="#c2d0e7">Version models and indexes</text><text x="616" y="789" font-family="Arial" font-size="23" fill="#c2d0e7">Route traffic to replacement</text><path d="M1046 696 H1076" fill="none" stroke="#5eead4" stroke-width="5" marker-end="url(#ar)"/><rect x="1086" y="573" width="464" height="247" rx="27" fill="url(#tile)" stroke="#334e74" stroke-width="2"/><circle cx="1141" cy="630" r="31" fill="#0b243e" stroke="#5eead4" stroke-width="3"/><text x="1141" y="640" text-anchor="middle" font-size="27" font-family="Arial" font-weight="bold" fill="#5eead4">06</text><text x="1121" y="703" font-family="Arial" font-size="31" font-weight="700" fill="#f7fbff">Verify &amp; attest</text><text x="1121" y="755" font-family="Arial" font-size="23" fill="#c2d0e7">Compare to reference; test leakage</text><text x="1121" y="789" font-family="Arial" font-size="23" fill="#c2d0e7">Record evidence and exceptions</text><path d="M1510 365 H1555 V558 H76" fill="none" stroke="#5eead4" opacity=".36" stroke-width="4" stroke-dasharray="12 12"/><rect x="77" y="859" width="1432" height="51" rx="15" fill="#1d3854" stroke="#52869a"/><text x="110" y="895" font-family="Arial" font-size="24" fill="#ecfbff">Audit trail: request ID • artifact inventory • model/index version • checks • reviewer • residual risks</text></svg>