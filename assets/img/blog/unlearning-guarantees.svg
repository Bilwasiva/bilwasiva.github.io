<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="870" viewBox="0 0 1560 870" role="img" aria-labelledby="ttl desc"><title id="ttl">Four claims of forgetting and their relative strength</title><desc id="desc">Comparing answer refusal, empirical approximate unlearning, certified removal with explicit assumptions, and exact retraining under fixed training procedures.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071527"/><stop offset="1" stop-color="#111e38"/></linearGradient></defs><rect width="1560" height="870" fill="url(#bg)"/><text x="70" y="95" fill="#f5f9ff" font-family="Arial" font-size="49" font-weight="800">Four claims that are often confused</text><text x="70" y="140" fill="#aebfdd" font-family="Arial" font-size="24">A refusal policy, a benchmark score, a proof, and retraining are not equivalent.</text><rect x="71" y="208" width="1410" height="136" rx="21" fill="#182b48" stroke="#2c4362" stroke-width="2"/><rect x="75" y="215" width="12" height="122" rx="6" fill="#fb7185"/><text x="112" y="260" fill="#fb7185" font-family="Arial" font-size="32" font-weight="800">01</text><text x="175" y="260" fill="#fff" font-family="Arial" font-size="32" font-weight="800">Output suppression</text><text x="175" y="297" fill="#c5d6ee" font-family="Arial" font-size="24">Model refuses or filters certain answers</text><text x="175" y="325" fill="#9db1d0" font-family="Arial" font-size="21">Caveat: No evidence that learned influence was removed</text><rect x="71" y="365" width="1410" height="136" rx="21" fill="#182b48" stroke="#2c4362" stroke-width="2"/><rect x="75" y="372" width="12" height="122" rx="6" fill="#fbbf24"/><text x="112" y="417" fill="#fbbf24" font-family="Arial" font-size="32" font-weight="800">02</text><text x="175" y="417" fill="#fff" font-family="Arial" font-size="32" font-weight="800">Empirical unlearning</text><text x="175" y="454" fill="#c5d6ee" font-family="Arial" font-size="24">Target behavior changes in the measured tests</text><text x="175" y="482" fill="#9db1d0" font-family="Arial" font-size="21">Caveat: Evidence is limited by test coverage and attacks</text><rect x="71" y="522" width="1410" height="136" rx="21" fill="#182b48" stroke="#2c4362" stroke-width="2"/><rect x="75" y="529" width="12" height="122" rx="6" fill="#7dd3fc"/><text x="112" y="574" fill="#7dd3fc" font-family="Arial" font-size="32" font-weight="800">03</text><text x="175" y="574" fill="#fff" font-family="Arial" font-size="32" font-weight="800">Certified removal</text><text x="175" y="611" fill="#c5d6ee" font-family="Arial" font-size="24">A bound holds under explicit assumptions</text><text x="175" y="639" fill="#9db1d0" font-family="Arial" font-size="21">Caveat: Guarantee is scoped to method, data, threat model</text><rect x="71" y="679" width="1410" height="136" rx="21" fill="#182b48" stroke="#2c4362" stroke-width="2"/><rect x="75" y="686" width="12" height="122" rx="6" fill="#5eead4"/><text x="112" y="731" fill="#5eead4" font-family="Arial" font-size="32" font-weight="800">04</text><text x="175" y="731" fill="#fff" font-family="Arial" font-size="32" font-weight="800">Exact counterfactual</text><text x="175" y="768" fill="#c5d6ee" font-family="Arial" font-size="24">Matches clean retraining by defined criterion</text><text x="175" y="796" fill="#9db1d0" font-family="Arial" font-size="21">Caveat: Only within specified training pipeline / randomness</text><text x="80" y="847" fill="#92a5c5" font-size="22" font-family="Arial">Conceptual taxonomy; guarantee strength depends on the formal definition and assumptions.</text></svg>