<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="655" version="1.1" viewBox="0 0 1500 655" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#081425" height="655" rx="28" width="1500" x="0" y="0" /><rect fill="none" height="607" rx="24" stroke="#34506d" stroke-width="2" width="1452" x="24" y="24" /><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="bold" x="62" y="78">Three model families, three distinct contracts</text><text fill="#afc4dd" font-family="Arial,Helvetica,sans-serif" font-size="21" x="62" y="119">They can be combined, but they are not synonyms and do not guarantee one another</text><rect fill="#122943" height="350" rx="18" stroke="#75afff" stroke-width="2" width="430" x="60" y="167" /><rect fill="#75afff" height="8" rx="4" width="430" x="60" y="167" /><text fill="#75afff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="84" y="214">VLM · UNDERSTAND</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="84" y="257">Input: images, video + text</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="84" y="288">Output: descriptions, answers,</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="84" y="319">semantic plans, scene labels</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="84" y="350" /><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="84" y="381">Question answered:</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="84" y="412">"What is happening?"</text><rect fill="#122943" height="350" rx="18" stroke="#f7bd61" stroke-width="2" width="430" x="533" y="167" /><rect fill="#f7bd61" height="8" rx="4" width="430" x="533" y="167" /><text fill="#f7bd61" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="557" y="214">WORLD MODEL · PREDICT</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="557" y="257">Input: state + candidate action</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="557" y="288">Output: possible future states,</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="557" y="319">rewards or observations</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="557" y="350" /><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="557" y="381">Question answered:</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="557" y="412">"What might happen next?"</text><rect fill="#122943" height="350" rx="18" stroke="#31dce5" stroke-width="2" width="430" x="1006" y="167" /><rect fill="#31dce5" height="8" rx="4" width="430" x="1006" y="167" /><text fill="#31dce5" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="bold" x="1030" y="214">VLA POLICY · ACT</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1030" y="257">Input: image + instruction</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1030" y="288">+ robot state / context</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1030" y="319">Output: action tokens, poses,</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1030" y="350">joint commands or chunks</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1030" y="381" /><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1030" y="412">Question answered:</text><text fill="#eff7ff" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="normal" x="1030" y="443">"What should I do?"</text><text fill="#73e4bb" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="normal" text-anchor="middle" x="750" y="575">A capable system connects all three to a real controller, verified sensors, and a safety layer.</text></svg>